name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: scripts/check.sh
      - run: scripts/check-downstream.sh
      - run: cargo test --manifest-path vendor/h3/Cargo.toml --all-features --locked
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-linux.sh
      - run: scripts/test-interop-linux.sh
