worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 65536; }
http {
    access_log off;
    keepalive_requests 1000000000;
    server {
        listen 8080 reuseport;
        location = /plaintext { default_type 'text/plain; charset=utf-8'; return 200 'Hello, World!'; }
        location = /json { default_type application/json; return 200 '{"message":"Hello, World!"}'; }
        location = /users/42 { default_type 'text/plain; charset=utf-8'; return 200 '42'; }
    }
}
