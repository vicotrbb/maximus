[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/h3"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vicotrbb/maximus"

[workspace.dependencies]
compio = { version = "=0.19.2", default-features = false, features = ["runtime", "io-uring", "polling", "time"] }
bytes = "1.11"
futures-util = { version = "0.3", features = ["io"] }
http = "1.4"
httpdate = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["server", "http1"] }
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Required until upstream ships strict decoded-field validation. See vendor/h3/PATCHES.md.
[patch.crates-io]
h3 = { path = "vendor/h3" }
