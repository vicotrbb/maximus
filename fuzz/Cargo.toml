[package]
name = "maximus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
maximus-core = { path = "../crates/core" }
maximus-router = { path = "../crates/router" }
maximus-http1 = { path = "../crates/http1" }
maximus-http2 = { path = "../crates/http2" }
maximus-runtime = { path = "../crates/runtime" }
compio = { version = "=0.19.2", default-features = false, features = ["runtime", "polling", "time"] }
futures-util = { version = "0.3", features = ["io"] }
http-body-util = "0.1"

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack"
path = "fuzz_targets/hpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1"
path = "fuzz_targets/http1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http2"
path = "fuzz_targets/http2.rs"
test = false
doc = false
bench = false
