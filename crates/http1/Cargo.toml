[package]
name = "maximus-http1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native incremental HTTP/1.1 engine for Maximus"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
maximus-core = { path = "../core" }
maximus-runtime = { path = "../runtime" }
compio = { workspace = true, features = ["io"] }
http-body-util.workspace = true
futures-util.workspace = true
send_wrapper = { version = "0.6", optional = true }

[features]
default = []
websocket = ["dep:send_wrapper", "compio/io-compat"]

[dev-dependencies]
compio = { workspace = true, features = ["net"] }
