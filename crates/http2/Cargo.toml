[package]
name = "maximus-http2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native HTTP/2 framing, HPACK and flow control for Maximus"
rust-version.workspace = true
[lints]
workspace = true
[dependencies]
maximus-core = { path = "../core" }
maximus-runtime = { path = "../runtime" }
compio = { workspace = true, features = ["io"] }
futures-util.workspace = true
bytes.workspace = true

[dev-dependencies]
compio = { workspace = true, features = ["net", "io-compat"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
